name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main, ccr-7828935c-x6reyg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Webseite zusammenstellen
        run: |
          mkdir _site
          cp index.html app.js config.js style.css sw.js icon.svg manifest.webmanifest _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
